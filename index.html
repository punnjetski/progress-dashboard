:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: a quiet atelier ledger. Bright stone ground, white sheets with hairline edges, midnight ink for action, a thin brass thread for the one precious detail. Serif headings, clean sans for everything operable. */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --surface2:#FAFAF7; --ink:#16181D; --ink2:#454A55; --ink3:#6B707B;
  --line:#EAE9E4; --line-strong:#D9D7CF;
  --accent:#1E2A44; --accent-hover:#2C3B5E; --accent-ink:#FFFFFF; --accent-soft:#EEF0F6; --ring:rgba(30,42,68,.14);
  --brass:#B09560; --brass-deep:#7A6230; --brass-line:rgba(176,149,96,.45);
  --panel:#1C2740; --panel-ink:#F6F3EC; --panel-ink2:rgba(246,243,236,.74);
  --work:#2E4A7D; --me:#3F7A66; --sel:#E9E0CB;
  --good:#2C7753; --good-soft:#E6F1EA; --warn:#8C5E14; --warn-soft:#F8F0DF; --bad:#9A2F2F; --bad-soft:#F8EAE6;
  --blk:#6B4A8F; --blk-soft:#F0EAF6; --on-solid:#FFFFFF;
  --c1:#2E4A7D; --c2:#3F7A66; --c3:#B0652F; --c4:#7A5BA6; --c5:#A8467A; --c6:#6E7684;
  --shadow-1:0 1px 2px rgba(22,24,29,.04),0 10px 28px -16px rgba(22,24,29,.14);
  --shadow-2:0 28px 70px -24px rgba(22,24,29,.40);
  --font-display:'Newsreader','IBM Plex Sans Thai','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-body:'Hanken Grotesk','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Hanken Grotesk','IBM Plex Sans Thai',system-ui,sans-serif;
  --radius:16px; --radius-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --surface:#161A21; --surface2:#1B2028; --ink:#ECE9E2; --ink2:#B6B3AB; --ink3:#8E9097;
  --line:#242932; --line-strong:#323843;
  --accent:#D9CBA6; --accent-hover:#E8DCC0; --accent-ink:#14171C; --accent-soft:#22252B; --ring:rgba(217,203,166,.20);
  --brass:#C2A86F; --brass-deep:#D9C48E; --brass-line:rgba(194,168,111,.40);
  --panel:#1C222D; --panel-ink:#F1EDE4; --panel-ink2:rgba(241,237,228,.72);
  --work:#93ABD8; --me:#7FC2A9; --sel:#3A3526;
  --good:#6CC59A; --good-soft:#16302A; --warn:#E0B26A; --warn-soft:#33291A; --bad:#F0907F; --bad-soft:#3A211F;
  --blk:#BDA6E4; --blk-soft:#2B2340; --on-solid:#14171C;
  --c1:#93ABD8; --c2:#7FC2A9; --c3:#E39A68; --c4:#B9A0E0; --c5:#E48BB8; --c6:#9AA4B3;
  --shadow-1:0 1px 2px rgba(0,0,0,.30),0 10px 28px -16px rgba(0,0,0,.50);
  --shadow-2:0 28px 70px -24px rgba(0,0,0,.70); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217; --surface:#161A21; --surface2:#1B2028; --ink:#ECE9E2; --ink2:#B6B3AB; --ink3:#8E9097;
  --line:#242932; --line-strong:#323843;
  --accent:#D9CBA6; --accent-hover:#E8DCC0; --accent-ink:#14171C; --accent-soft:#22252B; --ring:rgba(217,203,166,.20);
  --brass:#C2A86F; --brass-deep:#D9C48E; --brass-line:rgba(194,168,111,.40);
  --panel:#1C222D; --panel-ink:#F1EDE4; --panel-ink2:rgba(241,237,228,.72);
  --work:#93ABD8; --me:#7FC2A9; --sel:#3A3526;
  --good:#6CC59A; --good-soft:#16302A; --warn:#E0B26A; --warn-soft:#33291A; --bad:#F0907F; --bad-soft:#3A211F;
  --blk:#BDA6E4; --blk-soft:#2B2340; --on-solid:#14171C;
  --c1:#93ABD8; --c2:#7FC2A9; --c3:#E39A68; --c4:#B9A0E0; --c5:#E48BB8; --c6:#9AA4B3;
  --shadow-1:0 1px 2px rgba(0,0,0,.30),0 10px 28px -16px rgba(0,0,0,.50);
  --shadow-2:0 28px 70px -24px rgba(0,0,0,.70); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 80px;-webkit-text-size-adjust:100%}
::selection{background:var(--sel);color:var(--ink)}
input,textarea,select{caret-color:var(--brass)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15;font-weight:500;letter-spacing:-.012em}
h3,h4{font-family:var(--font-body);margin:0;text-wrap:balance;line-height:1.3;font-weight:600}
h1{font-size:clamp(34px,5vw,46px)}
h2{font-size:22px}
h3{font-size:15px}
h4{font-size:14px}
p{margin:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.date{color:var(--ink2);font-size:15px;margin-top:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:20px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:24px;min-height:64px;flex-wrap:wrap;padding-block:6px}
.brand{font:500 24px var(--font-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:7px;height:7px;background:var(--brass);transform:rotate(45deg);display:inline-block}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:8px 10px;color:var(--ink2);font-weight:500;border-bottom:1.5px solid transparent;transition:color .18s,border-color .18s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;line-height:1.2;white-space:nowrap;transition:border-color .18s,background .18s,box-shadow .18s}
.btn:hover{border-color:var(--ink3);box-shadow:0 1px 2px rgba(22,24,29,.05)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn-quiet:hover{box-shadow:none;background:var(--surface2);border-color:transparent}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);transition:background .18s}
.icon-btn:hover{background:var(--surface2)}
input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 13px;width:100%;min-width:0;transition:border-color .18s,box-shadow .18s}
input::placeholder,textarea::placeholder{color:var(--ink3);opacity:1}
textarea{resize:vertical;min-height:88px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);flex-wrap:nowrap}
.seg button{padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink2);border-radius:8px;white-space:nowrap;transition:background .18s,color .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,29,.06)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h .sub{color:var(--ink3);font-size:13.5px}
.card-h .right{margin-left:auto}
.empty{color:var(--ink3);padding:10px 0;font-size:14.5px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none;display:inline-block}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;border:1.3px solid currentColor;display:block;opacity:.55}
.dots i.on{background:currentColor;opacity:1}
.mode-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 14px;border-radius:99px;background:var(--accent-soft);color:var(--ink);font-weight:600;border:1px solid var(--line)}
.mode-chip .dots{color:var(--brass-deep)}

/* entry */
.entry{padding-block:clamp(36px,10vh,96px) 24px;display:flex;flex-direction:column;gap:10px}
.brand-big{font:500 22px var(--font-display);display:flex;align-items:center;gap:10px;margin-bottom:clamp(28px,7vh,64px)}
.brand-big i{width:7px;height:7px;background:var(--brass);transform:rotate(45deg)}
.entry h1{font-size:clamp(46px,8vw,84px);font-weight:400;letter-spacing:-.025em;line-height:1.02}
.lead{color:var(--ink2);font-size:17px;margin-top:4px;max-width:62ch}
.routes{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:36px}
.route{display:flex;flex-direction:column;gap:12px;padding:32px;border-radius:20px;border:1px solid var(--line);background:var(--surface);min-height:280px;box-shadow:var(--shadow-1);transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s,border-color .22s}
.route:hover{transform:translateY(-3px);border-color:var(--brass-line);box-shadow:0 1px 2px rgba(22,24,29,.04),0 22px 44px -22px rgba(22,24,29,.26)}
.route-main{background:var(--panel);border-color:var(--panel);color:var(--panel-ink);box-shadow:inset 0 0 0 1px var(--brass-line),0 22px 44px -26px rgba(28,39,64,.7)}
.route-main:hover{border-color:var(--panel)}
.route-title{font:500 30px/1.1 var(--font-display);letter-spacing:-.015em}
.route-body{color:var(--ink2)}
.route-main .route-body,.route-main .steps{color:var(--panel-ink2)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink2)}
.route-go{margin-top:auto;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.route-main .route-go{color:var(--brass)}
.hint{margin-top:22px;color:var(--ink3);font-size:13.5px}
.hint code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--ink2)}

/* flow pages */
.flow{padding-block:32px 40px;display:flex;flex-direction:column;gap:24px}
.stepper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
.stepper b{font-weight:500;padding:4px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface)}
.stepper b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper b.past{color:var(--ink2)}
.stepper s{width:20px;height:1px;background:var(--line-strong);display:inline-block}
.stats{display:flex;flex-wrap:wrap;gap:8px 0;color:var(--ink2)}
.stat{padding-right:22px;margin-right:22px;border-right:1px solid var(--line-strong);font-size:15px}
.stat:last-child{border-right:0;margin-right:0;padding-right:0}
.stat b{font:500 26px var(--font-display);color:var(--ink);margin-right:6px;letter-spacing:-.01em}
.stat.bad b{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.li .m{color:var(--ink3);font-size:13px}
.group-label{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 4px}
.group-label:first-child{margin-top:0}
.quote{border-left:1px solid var(--brass);padding:2px 0 2px 14px;color:var(--ink2);margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}

/* check-in */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.scale button{border:1px solid var(--line-strong);border-radius:14px;padding:18px 8px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:4px;align-items:center;transition:border-color .18s,background .18s}
.scale button b{font:500 26px var(--font-display)}
.scale button span{font-size:12.5px;color:var(--ink2);line-height:1.3}
.scale button:hover{border-color:var(--ink3)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button[aria-pressed="true"] span{color:inherit;opacity:.85}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mode{border:1px solid var(--line-strong);border-radius:16px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-height:160px;transition:border-color .18s,background .18s}
.mode:hover{border-color:var(--ink3)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.mode .dots{color:var(--brass-deep)}
.mode b{font:500 22px var(--font-display);letter-spacing:-.01em}
.mode .d{font-size:13.5px;color:var(--ink2)}
.mode .s{margin-top:auto;display:flex;justify-content:flex-end;min-height:20px}
.tag-suggest{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--brass-deep);background:var(--surface);border:1px solid var(--brass-line);border-radius:99px;padding:1px 9px;white-space:nowrap}
.field label{display:block;font-weight:500;margin-bottom:8px}

/* dashboard */
.dash{padding-block:32px;display:flex;flex-direction:column;gap:24px}
.dash-head{display:flex;gap:16px 24px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.dash-actions{display:flex;gap:10px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--ink2);border:1px solid var(--line)}
.banner .btn{background:var(--surface);color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 230px 120px 150px auto;gap:10px}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* task table */
.toolbar{display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tb-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-group>span{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.toolbar input[type=text]{width:200px;padding:7px 12px}
.tbl{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(260px,1fr) 92px 96px 108px 96px 100px;column-gap:12px;align-items:stretch;border-top:1px solid var(--line);transition:background .15s}
.trow:not(.thead):hover{background:var(--surface2)}
.thead{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-block:8px;align-items:center;border-top:0;border-bottom:1px solid var(--line-strong)}
.thead:hover{background:none!important}
.c-main{display:flex;align-items:flex-start;gap:6px;padding:8px 10px 8px 6px;border-radius:12px;margin-block:4px;min-width:0}
.thead .c-main{padding:0 0 0 42px;margin:0}
.trow.p1 .c-main{background:var(--warn-soft)}
.trow.p2 .c-main{background:var(--bad-soft)}
.sel{width:30px;height:30px;display:grid;place-items:center;flex:none}
.sel span{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .15s,border-color .15s}
.sel:hover span{border-color:var(--accent)}
.sel[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.c-task{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:4px;flex:1}
.t-title{font-weight:500;overflow-wrap:anywhere;font-size:15px}
.t-sub{font-size:12.5px;color:var(--ink3);display:flex;gap:4px 12px;flex-wrap:wrap}
.trow.p2 .t-title{font-weight:600}
.trow.p1 .t-sub,.trow.p2 .t-sub{color:var(--ink2)}
.c-meta{display:contents}
.trow .cell{display:flex;align-items:center;min-width:0}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:.01em;padding:3px 11px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink2);background:var(--surface);white-space:nowrap;min-width:74px;transition:border-color .15s}
button.pill:hover{border-color:var(--ink3)}
.pill.pr0{color:var(--ink3);font-weight:500;border-color:var(--line)}
.pill.pr1{background:var(--warn);border-color:var(--warn);color:var(--on-solid)}
.pill.pr2{background:var(--bad);border-color:var(--bad);color:var(--on-solid)}
.pill.st-doing{background:var(--accent-soft);border-color:var(--line);color:var(--ink)}
.pill.st-blocked{background:var(--blk-soft);border-color:transparent;color:var(--blk)}
.pill.st-done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);width:100%}
.prog .bar{flex:1}
.btn-done{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--line-strong);font-size:13px;font-weight:500;color:var(--ink2);background:var(--surface);align-self:center;margin-left:auto;transition:background .15s,color .15s,border-color .15s}
.btn-done:hover{background:var(--good-soft);border-color:transparent;color:var(--good)}
.is-done .t-title{text-decoration:line-through;text-decoration-color:var(--line-strong);color:var(--ink3)}
.is-done .c-main{background:transparent!important}
.is-done .btn-done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.g-area{display:flex;align-items:center;gap:12px;padding:26px 0 8px;flex-wrap:wrap}
.g-area:first-child{padding-top:4px}
.g-area h3{font:500 22px var(--font-display);letter-spacing:-.01em}
.g-area .mono{font-size:15px;font-weight:600}
.g-area .bar{width:110px}
.g-cat{display:flex;align-items:center;gap:12px;padding:16px 0 4px 18px;color:var(--ink2)}

const inScope = t => isOpen(t) || (t.doneDate && t.doneDate >= addDays(today(), -14));
const byPrio = (a, b) => (b.priority || 0) - (a.priority || 0) || (a.due || '9999').localeCompare(b.due || '9999') || (a.createdAt || '').localeCompare(b.createdAt || '');
const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.priority || 0) - (a.priority || 0) || (a.createdAt || '').localeCompare(b.createdAt || '');
const byNew = (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '');
const SORTS = {priority:byPrio, deadline:byDue, newest:byNew};
function suggestMode(body, mind){
  const m = (body + mind) / 2, lo = Math.min(body, mind);
  let k = m >= 4.5 ? 'push' : m >= 3.5 ? 'standard' : m >= 2.5 ? 'maintain' : 'relax';
  if(lo <= 2 && MODE_KEYS.indexOf(k) < 2) k = 'maintain';
  if(lo <= 1) k = 'relax';
  return k;
}
function dueInfo(t){
  if(!t.due || t.status === 'done') return null;
  const d = diffDays(t.due, today());
  if(d < 0) return {txt:'Overdue ' + (-d) + 'd', cls:'bad'};
  if(d === 0) return {txt:'Today', cls:'warn'};
  if(d === 1) return {txt:'Tomorrow', cls:'warn'};
  if(d <= 7) return {txt:'In ' + d + ' days', cls:''};
  return {txt:fmt(t.due, 'dm'), cls:''};
}
function areaProgress(area){
  const ts = S.tasks.filter(t => t.area === area && inScope(t));
  return {pct:Math.round(avg(ts.map(taskPct))), open:ts.filter(isOpen).length};
}
function projProgress(p){
  const ts = S.tasks.filter(t => t.projectId === p.id);
  return {pct:Math.round(avg(ts.map(taskPct))), done:ts.filter(t => !isOpen(t)).length, total:ts.length};
}
function pathOf(t){
  const p = t.projectId && proj(t.projectId);
  return AREAS[t.area] + ' › ' + (p ? p.name : 'General');
}

/* ---------- views ---------- */
function topbar(){
  const cur = S.view;
  const tab = (v, label, match) => '<button class="tab" data-act="nav" data-v="' + v + '"' + ((match || [v]).indexOf(cur) >= 0 ? ' aria-current="page"' : '') + '>' + label + '</button>';
  return '<header class="top"><div class="top-in"><button class="brand" data-act="toEntry" aria-label="Back to start"><i></i>Progress Dashboard</button>' +
    '<nav class="tabs" aria-label="Main">' + tab('dash', 'Dashboard', ['dash', 'brief', 'reflect', 'checkin']) + tab('history', 'History') + tab('projects', 'Categories') + '</nav>' + themeCtl() + '</div></header>';
}

function vEntry(){
  const ck = todayCk(), ok = ready();
  const normalBody = ck
    ? '<p class="route-body">You already checked in today (' + MODES[ck.mode].n + '). Go straight to the dashboard.</p>'
    : '<ol class="steps"><li>Read the overview and yesterday’s progress</li><li>Check in on body and mind, then pick a mode</li><li>Open the dashboard</li></ol>';
  return '<main class="entry wrap"><div class="entry-top"><div class="brand-big"><i></i>Progress Dashboard</div>' + themeCtl() + '</div>' +

    '<div class="routes">' +
    '<button class="route route-main" data-act="goNormal"><span class="route-title">Normal route</span><p class="route-body" style="font-weight:500">Prepare for the day</p>' + normalBody + '<span class="route-go">' + (ck ? 'Go to dashboard →' : 'Start →') + '</span></button>' +
    '<button class="route" data-act="goExpress"><span class="route-title">Express route</span><p class="route-body" style="font-weight:500">Straight to the dashboard</p><p class="route-body">Skip the overview and check-in when something urgent needs a look right now.</p><span class="route-go">Go →</span></button>' +
    '</div><p class="hint">' + (ok ? '' : 'Connecting to your data… ') + 'To skip this page every time, bookmark the app link with <code>#express</code> at the end.</p></main>';
}

function stepper(n){
  const s = ['Overview', 'Readiness check-in', 'Dashboard'];
  return '<div class="stepper" aria-label="Morning steps">' + s.map((x, i) => '<b class="' + (i + 1 === n ? 'on' : i + 1 < n ? 'past' : '') + '">' + (i + 1) + ' ' + x + '</b>').join('<s></s>') + '</div>';
}

function brief(){
  const t = today(), open = S.tasks.filter(isOpen);
  const overdue = open.filter(x => x.due && x.due < t).sort(byDue);
  const soon = open.filter(x => x.due && x.due >= t && x.due <= addDays(t, 7)).sort(byDue);
  const doing = open.filter(x => x.status === 'doing');
  const blocked = open.filter(x => x.status === 'blocked');
  const dates = new Set();
  S.checkins.forEach(c => c.date && dates.add(c.date));
  S.tasks.forEach(x => { if(x.doneDate) dates.add(x.doneDate); if(x.touchDate) dates.add(x.touchDate); (x.log || []).forEach(l => l.d && dates.add(l.d)); });
  const prevs = Array.from(dates).filter(d => d < t && d >= addDays(t, -14)).sort();
  const prev = prevs.length ? prevs[prevs.length - 1] : null;
  const y = {date:prev};
  if(prev){
    y.done = S.tasks.filter(x => x.doneDate === prev);
    y.moved = S.tasks.filter(x => x.touchDate === prev && isOpen(x) && x.createDate !== prev);
    y.carry = S.tasks.filter(x => x.focusDate === prev && isOpen(x));
    y.ck = ckOf(prev);
    y.logs = [];
    S.tasks.forEach(x => (x.log || []).forEach(l => { if(l.d === prev) y.logs.push({t:x.title, text:l.text}); }));
  }
  return {t, overdue, soon, doing, blocked, y, doneWeek:S.tasks.filter(x => x.doneDate && x.doneDate > addDays(t, -7)).length};
}
function listItems(ts, empty){
  if(!ts.length) return empty ? '<p class="empty">' + empty + '</p>' : '';
  return '<div class="list">' + ts.map(x => { const d = dueInfo(x); return '<div class="li"><span class="t">' + h(x.title) + '</span><span class="m">' + h(pathOf(x)) + '</span>' + (d ? '<span class="chip ' + d.cls + '">' + d.txt + '</span>' : '') + '</div>'; }).join('') + '</div>';
}
function vBrief(){
  const b = brief(), y = b.y, fl = S.flow;
  const yTitle = y.date ? (diffDays(b.t, y.date) === 1 ? 'Yesterday' : 'Last working day') + ' · ' + fmt(y.date, 'short') : 'Yesterday';
  let yest = '';
  if(!y.date) yest = '<p class="empty">No history yet. Once you add tasks and mark them done, yesterday’s summary shows up here.</p>';
  else {
    const ck = y.ck;
    yest = (ck && ck.mode ? '<div class="row" style="margin-bottom:6px"><span class="mode-chip">' + dotsHtml(MODES[ck.mode].dots) + MODES[ck.mode].n + '</span><span class="muted mono">Body ' + ck.body + '/5 · Mind ' + ck.mind + '/5</span></div>' : '') +
      '<div class="group-label">Completed (' + y.done.length + ')</div>' + listItems(y.done, 'Nothing was completed that day.') +
      (y.moved.length ? '<div class="group-label">Moved forward (' + y.moved.length + ')</div>' + listItems(y.moved, '') : '') +
      (y.carry.length ? '<div class="group-label">Picked but not finished (' + y.carry.length + ')</div>' + listItems(y.carry, '') : '') +
      (y.logs.length ? '<div class="group-label">Notes</div>' + y.logs.map(l => '<div class="quote"><b>' + h(l.t) + '</b><br>' + h(l.text) + '</div>').join('') : '') +
      (ck && ck.wrap ? '<div class="group-label">Closing note</div><div class="quote">' + h(ck.wrap) + '</div>' : '');
  }
  const facts = '<div class="stats"><span class="stat ' + (b.overdue.length ? 'bad' : '') + '"><b>' + b.overdue.length + '</b>Overdue</span><span class="stat"><b>' + b.soon.length + '</b>Due in 7 days</span><span class="stat"><b>' + b.doing.length + '</b>Doing</span><span class="stat"><b>' + b.blocked.length + '</b>Blocked</span></div>';
  const next = fl ? '<button class="btn btn-primary" data-act="briefNext">Continue to readiness check-in →</button>' : '<button class="btn btn-primary" data-act="nav" data-v="dash">Back to dashboard</button><button class="btn" data-act="briefNext">Readiness check-in</button>';
  const areaRows = ['work', 'personal'].map(a => { const p = areaProgress(a); return '<div class="hbar"><span>' + AREAS[a] + '</span><div class="bar"><i style="width:' + p.pct + '%;background:var(--' + (a === 'work' ? 'work' : 'me') + ')"></i></div><span class="mono">' + p.pct + '%</span></div>'; }).join('');
  return topbar() + '<main class="flow wrap">' + (fl ? stepper(1) : '') +
    '<div><h1>Overview</h1><p class="date">' + fmt(b.t, 'long') + '</p></div>' + facts +
    '<div class="two"><section class="card"><div class="card-h"><h2>This period</h2><span class="sub">' + plural(b.doneWeek, 'task') + ' completed in the last 7 days</span></div>' + areaRows +
    '<div class="group-label">Overdue</div>' + listItems(b.overdue, 'Nothing overdue.') +
    '<div class="group-label">Due in 7 days</div>' + listItems(b.soon, 'Nothing due soon.') +
    (b.blocked.length ? '<div class="group-label">Blocked</div>' + listItems(b.blocked, '') : '') + '</section>' +
    '<section class="card"><div class="card-h"><h2>' + yTitle + '</h2></div>' + yest + '</section></div>' +
    '<div class="row">' + next + '</div></main>';
}

/* check-in */
function startDraft(){
  const c = todayCk();
  S.draft = c ? {body:c.body, mind:c.mind, mode:c.mode, note:c.note || '', touched:true} : {body:0, mind:0, mode:'', note:'', touched:false};
}
function vCheckin(){
  const d = S.draft || (startDraft(), S.draft);
  const sug = d.body && d.mind ? suggestMode(d.body, d.mind) : null;
  const mode = d.mode || (sug && !d.touched ? sug : '');
  const scale = (k, labels) => '<div class="scale" role="group">' + [1, 2, 3, 4, 5].map(i => '<button data-act="setScale" data-k="' + k + '" data-v="' + i + '" aria-pressed="' + (d[k] === i) + '"><b>' + i + '</b><span>' + labels[i - 1] + '</span></button>').join('') + '</div>';
  const modes = '<div class="modes">' + MODE_KEYS.map(k => { const m = MODES[k]; return '<button class="mode" data-act="setMode" data-v="' + k + '" aria-pressed="' + (mode === k) + '">' + dotsHtml(m.dots) + '<b>' + m.n + '</b><span class="d">' + m.desc + '</span><span class="s">' + (sug === k ? '<span class="tag-suggest">Suggested</span>' : '') + '</span></button>'; }).join('') + '</div>';
  const why = sug ? '<p class="muted" style="margin-top:10px">Based on body ' + d.body + ' and mind ' + d.mind + ', the suggestion is ' + MODES[sug].n + (Math.min(d.body, d.mind) <= 2 ? ' (the lower score pulls it down)' : '') + '. It is only a mirror. Pick whatever matches how you actually want to work today.</p>' : '';
  const can = d.body && d.mind && mode;
  const fl = S.flow;
  return topbar() + '<main class="flow wrap" style="max-width:860px">' + (fl ? stepper(2) : '') +
    '<div class="row"><button class="btn btn-sm" data-act="backToBrief">← Back to overview</button></div>' +
    '<div><h1>Readiness check-in</h1><p class="date">' + fmt(today(), 'long') + '</p><p class="lead" style="margin-top:12px">A minute to reflect before you start. The mode does not limit your day. How much you take on is still your call.</p></div>' +
    '<section class="card"><div class="card-h"><h2>Body right now</h2><span class="sub">Sleep, aches, energy</span></div>' + scale('body', BODY_L) + '</section>' +
    '<section class="card"><div class="card-h"><h2>Mind right now</h2><span class="sub">How clear or heavy your head feels</span></div>' + scale('mind', MIND_L) + '</section>' +
    '<section class="card"><div class="card-h"><h2>Mode for today</h2></div>' + modes + why + '</section>' +
    '<section class="card field"><label for="ck-note">Note to self <span class="faint">(optional)</span></label><textarea id="ck-note" data-bind="draft.note" placeholder="e.g. Slept badly, but the supplier meeting matters. Keep to the main tasks.">' + h(d.note) + '</textarea></section>' +
    '<div class="row"><button class="btn btn-primary" data-act="saveCheckin"' + (can ? '' : ' disabled') + '>Save and open dashboard →</button>' + (fl ? '<button class="btn btn-quiet" data-act="goExpress">Skip check-in today</button>' : '') + '</div></main>';
}

/* ---------- task table ---------- */
function taskRow(t, o){
  o = o || {};
  const d = dueInfo(t), pct = taskPct(t), focus = t.focusDate === today(), done = t.status === 'done';
  const subs = t.subtasks && t.subtasks.length ? t.subtasks.filter(s => s.done).length + '/' + t.subtasks.length + ' subtasks' : '';
  const sub = [o.path ? h(pathOf(t)) : '', subs, o.why || ''].filter(Boolean).map(x => '<span>' + x + '</span>').join('');
  const pr = t.priority || 0;
  const subsBlock = S.tbl.subs !== 'hide' && !done && t.subtasks && t.subtasks.length
    ? '<div class="subs">' + t.subtasks.map((s, i) => '<div class="sub-line' + (s.done ? ' is-done' : '') + '"><button class="sub-chk" data-act="subToggleRow" data-id="' + t.id + '" data-i="' + i + '" aria-pressed="' + !!s.done + '" aria-label="' + (s.done ? 'Mark subtask open: ' : 'Mark subtask done: ') + h(s.t) + '">' + ICON.check + '</button><span>' + h(s.t) + '</span></div>').join('') + '</div>' : '';
  return '<div class="trow p' + pr + (done ? ' is-done' : '') + '">' +
    '<div class="c-main"><button class="sel" data-act="toggleFocus" data-id="' + t.id + '" aria-pressed="' + focus + '" aria-label="' + (focus ? 'Remove from today’s Priority: ' : 'Add to today’s Priority: ') + h(t.title) + '"><span>' + ICON.check + '</span></button>' +
    '<button class="c-task" data-act="openTask" data-id="' + t.id + '"><span class="t-title">' + h(t.title) + '</span>' + (sub ? '<span class="t-sub">' + sub + '</span>' : '') + '</button></div>' +
    '<div class="c-meta">' +
    '<div class="cell">' + (done ? '<span class="pill pr' + pr + '">' + PRIO[pr] + '</span>' : '<button class="pill pr' + pr + '" data-act="cyclePrio" data-id="' + t.id + '" title="Click to change priority">' + PRIO[pr] + '</button>') + '</div>' +
    '<div class="cell">' + (done ? '<span class="pill st-done">Done</span>' : '<button class="pill st-' + t.status + '" data-act="cycleStatus" data-id="' + t.id + '" title="Click to change status">' + STATUS[t.status] + '</button>') + '</div>' +
    '<div class="cell">' + (d ? '<span class="chip ' + d.cls + '">' + d.txt + '</span>' : (done && t.doneDate ? '<span class="faint" style="font-size:12.5px">' + fmt(t.doneDate, 'dm') + '</span>' : '<span class="faint">—</span>')) + '</div>' +
    '<div class="cell cell-prog">' + (pct > 0 || done ? '<span class="prog"><span class="bar"><i style="width:' + pct + '%"></i></span>' + pct + '%</span>' : '<span class="faint" style="font-size:12px">—</span>') + '</div>' +
    '</div>' +
    '<div class="cell cell-done"><button class="btn-done" data-act="toggleDone" data-id="' + t.id + '" aria-label="' + (done ? 'Reopen: ' : 'Mark done: ') + h(t.title) + '">' + ICON.check + (done ? 'Reopen' : 'Done') + '</button></div>' + subsBlock + '</div>';
}
const THEAD = '<div class="trow thead"><div class="c-main">Task</div><div class="c-meta"><div>Priority</div><div>Status</div><div>Deadline</div><div>Progress</div></div><div></div></div>';

function tableList(){
  const f = S.tbl, t = today(), q = f.q.trim().toLowerCase();
  let list = S.tasks.filter(x => (f.area === 'all' || x.area === f.area) && (!q || (x.title + ' ' + pathOf(x) + ' ' + (x.subtasks || []).map(s => s.t).join(' ')).toLowerCase().indexOf(q) >= 0));
  if(f.show === 'open') list = list.filter(isOpen);
  else if(f.show === 'recent') list = list.filter(x => isOpen(x) || x.doneDate > addDays(t, -7));
  else list = list.filter(x => !isOpen(x) && x.doneDate > addDays(t, -30));
  return list.sort(SORTS[f.sort]);
}
function vTable(){
  const f = S.tbl, t = today(), list = tableList(), parts = [];
  if(f.group === 'category'){
    ['work', 'personal'].forEach(a => {
      const items = list.filter(x => x.area === a);
      if(!items.length) return;
      const ap = areaProgress(a);
      parts.push('<div class="g-area"><span class="dot" style="background:var(--' + (a === 'work' ? 'work' : 'me') + ')"></span><h3>' + AREAS[a] + '</h3><span class="mono" style="color:var(--' + (a === 'work' ? 'work' : 'me') + ')">' + ap.pct + '%</span><span class="bar"><i style="width:' + ap.pct + '%;background:var(--' + (a === 'work' ? 'work' : 'me') + ')"></i></span><span class="faint" style="font-size:13px">' + ap.open + ' open</span></div>');
      const ids = S.projects.filter(p => p.area === a).map(p => p.id);
      ids.concat(['']).forEach(pid => {
        const rows = items.filter(x => (x.projectId || '') === pid || (pid === '' && !proj(x.projectId)));
        if(!rows.length) return;
        const p = pid ? proj(pid) : null, pp = p ? projProgress(p) : null;
        parts.push('<div class="g-cat"><h4>' + h(p ? p.name : 'General') + '</h4>' + (p && p.archived ? '<span class="chip">Archived</span>' : '') + (pp ? '<span class="mono faint" style="font-size:12px">' + pp.done + '/' + pp.total + '</span><span class="bar"><i style="width:' + pp.pct + '%;background:var(--' + h(p.color || 'c6') + ')"></i></span>' : '') + '</div>');
        rows.forEach(x => parts.push(taskRow(x)));
      });
    });
  } else {
    let defs;
    if(f.group === 'priority') defs = [[2, 'Urgent', 'pr2'], [1, 'High', 'pr1'], [0, 'Normal', 'pr0']].map(([v, l, c]) => ({l, c:'pill ' + c, rows:list.filter(x => (x.priority || 0) === v)}));
    else if(f.group === 'status') defs = ['doing', 'todo', 'blocked', 'done'].map(k => ({l:STATUS[k], c:'pill st-' + k, rows:list.filter(x => x.status === k)}));
    else if(f.group === 'deadline') defs = [
      ['Overdue', x => x.due && x.due < t, 'pill pr2'], ['Today', x => x.due === t, 'pill pr1'], ['Next 7 days', x => x.due > t && x.due <= addDays(t, 7), 'pill st-doing'],
      ['Later', x => x.due > addDays(t, 7), 'pill'], ['No deadline', x => !x.due, 'pill pr0']
    ].map(([l, fn, c]) => ({l, c, rows:list.filter(fn)}));
    else defs = [{l:'All tasks', c:'pill', rows:list}];
    defs.forEach(g => {
      if(!g.rows.length) return;
      if(f.group !== 'none') parts.push('<div class="g-flat"><span class="' + g.c + '">' + g.l + '</span><span class="mono faint">' + g.rows.length + '</span></div>');
      g.rows.forEach(x => parts.push(taskRow(x, {path:true})));
    });
  }
  return parts.length ? '<div class="tbl">' + THEAD + parts.join('') + '</div>' : '<p class="empty">' + (S.tasks.length ? 'No tasks match these filters.' : 'No tasks yet. Add your first one above.') + '</p>';
}
function seg(items, cur, k){ return '<div class="seg">' + items.map(([v, l]) => '<button data-act="tbl" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (cur === v) + '">' + l + '</button>').join('') + '</div>'; }

function vDash(){
  const t = today(), ck = todayCk(), mode = ck && MODES[ck.mode];
  const open = S.tasks.filter(isOpen);
  const focus = open.filter(x => x.focusDate === t).sort(byPrio);
  const carry = open.filter(x => x.focusDate && x.focusDate < t).sort(byPrio);
  const overdue = open.filter(x => x.due && x.due < t).length, blocked = open.filter(x => x.status === 'blocked').length;
  const examples = S.tasks.filter(x => x.example).length + S.projects.filter(x => x.example).length + S.checkins.filter(x => x.example).length;
  const optGroup = a => '<optgroup label="' + AREAS[a] + '">' + S.projects.filter(p => p.area === a && !p.archived).map(p => '<option value="p:' + p.id + '"' + (S.qa.target === 'p:' + p.id ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '<option value="loose:' + a + '"' + (S.qa.target === 'loose:' + a ? ' selected' : '') + '>' + AREAS[a] + ' › General</option></optgroup>';

  const ckBanner = !ck ? '<div class="banner info"><span>You have not checked in today.</span><button class="btn btn-sm" data-act="recheck">Check in now</button></div>' : '';
  const exBanner = examples ? '<div class="banner"><span>' + examples + ' sample items (in Thai) are still in your data.</span>' + (S.askClear ? '<button class="btn btn-sm btn-danger" data-act="clearExamples">Confirm: delete sample items</button><button class="btn btn-sm" data-act="askClear">Cancel</button>' : '<button class="btn btn-sm" data-act="askClear">Delete sample items</button>') + '</div>' : '';
  const offBanner = S.offline ? '<div class="banner"><span>Not connected to the database. Outside the artifact link nothing is saved.</span></div>' : '';

  const wrapVal = S.wrap != null ? S.wrap : (ck && ck.wrap) || '';
  const doneToday = S.tasks.filter(x => x.doneDate === t).length;

  const prioCard = '<section class="card"><div class="card-h"><h2>Today’s Priority</h2><span class="chip mono">' + focus.length + '</span>' +
    '<span class="right">' + (mode ? '<button class="mode-chip" data-act="recheck" title="Redo check-in">' + dotsHtml(mode.dots) + mode.n + '</button>' : '') + '</span></div>' +
    (focus.length ? '<div class="tbl">' + THEAD + focus.map(x => taskRow(x, {path:true})).join('') + '</div>' : '<p class="empty">Nothing picked yet. Tick the box at the left of any task below to put it here.</p>') +
    (carry.length ? '<div class="group-label" style="margin-top:16px">Picked earlier, still open</div><div class="tbl">' + carry.slice(0, 5).map(x => taskRow(x, {path:true, why:'picked ' + fmt(x.focusDate, 'dm')})).join('') + '</div>' : '') + '</section>';

  const tableCard = '<section class="card" id="all-tasks"><div class="card-h"><h2>All tasks in hand</h2><span class="sub">' + plural(open.length, 'open task') + (overdue ? ' · ' + overdue + ' overdue' : '') + (blocked ? ' · ' + blocked + ' blocked' : '') + '</span></div>' +
    '<div class="toolbar">' +
    '<div class="tb-group"><span>Group</span>' + seg([['category', 'Category'], ['priority', 'Priority'], ['deadline', 'Deadline'], ['status', 'Status'], ['none', 'None']], S.tbl.group, 'group') + '</div>' +
    '<div class="tb-group"><span>Sort</span>' + seg([['priority', 'Priority'], ['deadline', 'Deadline'], ['newest', 'Newest']], S.tbl.sort, 'sort') + '</div>' +
    '<div class="tb-group"><span>Area</span>' + seg([['all', 'All'], ['work', 'Company'], ['personal', 'Personal']], S.tbl.area, 'area') + '</div>' +

/* reflect */
function chartSvg(days){
  const W = 640, H = 220, L = 30, R = 10, T = 12, B = 28, n = days.length;
  const x = i => L + (W - L - R) * (i / (n - 1)), y = v => T + (H - T - B) * (1 - (v - 1) / 4);
  let g = '';
  for(let v = 1; v <= 5; v++) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  days.forEach((d, i) => { if(i % 2 === 0 || i === n - 1) { const p = parse(d.date); g += '<text class="ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + p.getDate() + '/' + (p.getMonth() + 1) + '</text>'; } });
  const series = (k, cls) => {
    let path = '', prev = false, pts = '', last = -1;
    days.forEach((d, i) => { if(d[k]){ path += (prev ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[k]).toFixed(1); prev = true; last = i; pts += '<circle class="p' + cls + '" cx="' + x(i).toFixed(1) + '" cy="' + y(d[k]).toFixed(1) + '" r="3.2"/>'; } else prev = false; });
    if(last >= 0) pts += '<circle class="p' + cls + '" cx="' + x(last).toFixed(1) + '" cy="' + y(days[last][k]).toFixed(1) + '" r="5.5"/>';
    return '<path class="s' + cls + '" d="' + path + '"/>' + pts;
  };
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Body and mind scores for the last 14 days">' + g + series('body', 1) + series('mind', 2) + '</svg>';
}
function vReflect(){
  const t = today(), ck = todayCk();
  const days = []; for(let i = 13; i >= 0; i--){ const d = addDays(t, -i), c = ckOf(d); days.push({date:d, body:c && c.body || 0, mind:c && c.mind || 0}); }
  const has = days.some(d => d.body);
  const all = S.checkins.filter(c => c.mode && c.date).sort((a, b) => b.date.localeCompare(a.date));
  const last7 = all.filter(c => c.date > addDays(t, -7)), last30 = all.filter(c => c.date > addDays(t, -30));
  const cnt = {}; MODE_KEYS.forEach(k => cnt[k] = last30.filter(c => c.mode === k).length);
  const maxc = Math.max(1, ...MODE_KEYS.map(k => cnt[k]));
  const perMode = MODE_KEYS.map(k => { const ds = last30.filter(c => c.mode === k); return {k, n:ds.length, v:avg(ds.map(c => S.tasks.filter(x => x.doneDate === c.date).length))}; }).filter(x => x.n);
  const over = last30.filter(c => c.mode === 'push' && Math.min(c.body, c.mind) <= 2).length;
  const todayCard = ck ? '<div class="big-score"><div><b>' + ck.body + '</b><span>Body · ' + BODY_L[ck.body - 1] + '</span></div><div><b>' + ck.mind + '</b><span>Mind · ' + MIND_L[ck.mind - 1] + '</span></div><div><span class="mode-chip" style="margin-bottom:6px">' + dotsHtml(MODES[ck.mode].dots) + MODES[ck.mode].n + '</span><br><span>' + MODES[ck.mode].desc + '</span></div></div>' + (ck.note ? '<div class="quote" style="margin-top:14px">' + h(ck.note) + '</div>' : '')
    : '<p class="empty">You have not checked in today.</p>';
  return topbar() + '<main class="flow wrap">' +
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Readiness summary</h1><p class="date">' + fmt(t, 'long') + '</p></div><div class="row"><button class="btn" data-act="recheck">' + (ck ? 'Redo today’s check-in' : 'Check in now') + '</button><button class="btn btn-primary" data-act="nav" data-v="dash">Back to dashboard</button></div></div>' +
    '<section class="card"><div class="card-h"><h2>Today</h2></div>' + todayCard + '</section>' +
    '<section class="card"><div class="card-h"><h2>Last 14 days</h2>' + (last7.length ? '<span class="sub mono">7-day average: body ' + avg(last7.map(c => c.body)).toFixed(1) + ' · mind ' + avg(last7.map(c => c.mind)).toFixed(1) + '</span>' : '') + '</div>' +
    (has ? '<div class="legend"><span><i style="background:var(--me)"></i>Body</span><span><i style="background:var(--accent)"></i>Mind</span></div><div class="tbl-scroll"><div style="min-width:420px">' + chartSvg(days) + '</div></div>' : '<p class="empty">No check-ins yet. After a few days the chart appears here.</p>') + '</section>' +
    '<div class="two"><section class="card"><div class="card-h"><h2>Modes you chose</h2><span class="sub">Last 30 days</span></div>' +
    (last30.length ? MODE_KEYS.map(k => '<div class="hbar"><span>' + MODES[k].n + '</span><div class="bar"><i style="width:' + (100 * cnt[k] / maxc) + '%"></i></div><span class="mono">' + plural(cnt[k], 'day') + '</span></div>').join('') : '<p class="empty">No data yet.</p>') + '</section>' +
    '<section class="card"><div class="card-h"><h2>What it looked like</h2></div>' +
    (perMode.length ? '<div class="group-label">Tasks completed per day, by mode</div>' + perMode.map(p => '<div class="hbar"><span>' + MODES[p.k].n + '</span><span class="muted">' + plural(p.n, 'day') + '</span><span class="mono">' + p.v.toFixed(1) + '</span></div>').join('') : '<p class="empty">No data yet.</p>') +
    (over ? '<p class="muted" style="margin-top:12px">You chose Push on ' + plural(over, 'day') + ' when body or mind was 2 or lower.</p>' : '') + '</section></div>' +
    '<section class="card"><div class="card-h"><h2>Past check-ins</h2></div>' + (all.length ? all.slice(0, 14).map(c => '<div class="day"><div><b>' + fmt(c.date, 'short') + '</b></div><div class="meta"><span class="mode-chip" style="padding:2px 10px;font-size:13px">' + dotsHtml(MODES[c.mode].dots) + MODES[c.mode].n + '</span><span class="mono muted">Body ' + c.body + ' · Mind ' + c.mind + '</span>' + (c.note ? '<span class="muted" style="flex-basis:100%">' + h(c.note) + '</span>' : '') + '</div></div>').join('') : '<p class="empty">Nothing yet.</p>') + '</section></main>';
}

function renderModal(){
  if(!S.modal) return;

  if(ae && modalEl.contains(ae) && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.id !== 'm-pct') return;

/* ---------- render ---------- */
let raf = 0;
function scheduleRender(){ if(!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render(){
  const ae = document.activeElement;
  const id = ae && ae.id && app.contains(ae) ? ae.id : null;
  const sel = id && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  app.innerHTML = S.auth === 'out' ? vLogin() : S.auth === 'checking' ? '<p style="padding:24px 0;color:var(--ink2)">Loading Progress Dashboard…</p>' : VIEWS[S.view]() + footerHtml();
  window.scrollTo(0, y);
  if(id){ const el = document.getElementById(id); if(el){ el.focus({preventScroll:true}); if(sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
  renderModal();
}
function go(v){ S.view = v; S.askClear = false; window.scrollTo(0, 0); render(); }
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function setPath(path, val){ const p = path.split('.'); let o = S; for(let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }

/* ---------- actions ---------- */
const ACT = {
  nav(b){ if(b.dataset.v === 'dash') S.flow = false; go(b.dataset.v); },
  toEntry(){ S.flow = false; go('entry'); },
  goExpress(){ S.flow = false; go('dash'); },
  async goNormal(){
    /* Wait briefly for stored data so a check-in made earlier today is recognised. */
    for(let i = 0; i < 40 && !ready(); i++) await new Promise(r => setTimeout(r, 100));
    if(todayCk()){ S.flow = false; go('dash'); } else { S.flow = true; go('brief'); }
  },
  openBrief(){ S.flow = false; go('brief'); },
  backToBrief(){ go('brief'); },
  openReflect(){ S.flow = false; go('reflect'); },
  briefNext(){ startDraft(); go('checkin'); },
  recheck(){ startDraft(); go('checkin'); },
  setScale(b){ S.draft[b.dataset.k] = +b.dataset.v; render(); },
  setMode(b){ S.draft.mode = b.dataset.v; S.draft.touched = true; render(); },
  saveCheckin(){
    const d = S.draft; const sug = suggestMode(d.body, d.mind); const mode = d.mode || (!d.touched ? sug : '');
    if(!(d.body && d.mind && mode)) return;
    const old = ckOf(today()) || {};
    const doc = Object.assign({}, old.example ? {example:true} : {}, {date:today(), body:d.body, mind:d.mind, mode:mode, note:d.note || '', wrap:old.wrap || '', at:nowIso()});
    delete doc.id;
    write('checkins/' + today(), 'set', doc);
    S.draft = null; S.flow = false; toast('Saved. Today’s mode is ' + MODES[mode].n); go('dash');
  },
  saveWrap(){
    const v = S.wrap == null ? '' : S.wrap; const c = ckOf(today());
    if(c) write('checkins/' + today(), 'update', {wrap:v}); else write('checkins/' + today(), 'set', {date:today(), wrap:v});
    S.wrap = null; toast('Closing note saved');
  },
  addTask(){
    const title = S.qa.title.trim(); if(!title){ const el = document.getElementById('qa-title'); if(el) el.focus(); return; }
    const tg = S.qa.target; let o = {title:title, due:S.qa.due || '', priority:+S.qa.prio || 0};
    if(tg.indexOf('p:') === 0){ const p = proj(tg.slice(2)); if(p){ o.projectId = p.id; o.area = p.area; } }
    else o.area = tg.slice(6) || 'work';
    createTask(o); S.qa.title = ''; S.qa.due = ''; render();
    const el = document.getElementById('qa-title'); if(el) el.focus();
  },
  toggleDone(b){ const t = S.tasks.find(x => x.id === b.dataset.id); if(t) patchTask(t.id, {status:t.status === 'done' ? 'todo' : 'done'}); },
  cycleStatus(b){ const t = S.tasks.find(x => x.id === b.dataset.id); if(t) patchTask(t.id, {status:{todo:'doing', doing:'blocked', blocked:'todo'}[t.status] || 'todo'}); },
  cyclePrio(b){ const t = S.tasks.find(x => x.id === b.dataset.id); if(t) patchTask(t.id, {priority:((t.priority || 0) + 1) % 3}); },
  toggleFocus(b){ const t = S.tasks.find(x => x.id === b.dataset.id); if(t) patchTask(t.id, {focusDate:t.focusDate === today() ? '' : today()}); },
  openTask(b){ openModal(b.dataset.id); },
  closeModal(){ closeModal(); },
  tbl(b){ S.tbl[b.dataset.k] = b.dataset.v; saveTbl(); render(); },
  async signIn(){
    if(S.loginBusy || !S.sb) return;
    const email = S.login.email.trim(), password = S.login.pass;
    if(!email || !password){ S.loginErr = 'Enter your email and password.'; return render(); }
    S.loginBusy = true; S.loginErr = ''; render();
    const res = await S.sb.auth.signInWithPassword({email:email, password:password});
    S.loginBusy = false; S.login.pass = '';
    if(res.error) S.loginErr = /invalid/i.test(res.error.message) ? 'Email or password is incorrect.' : res.error.message;
    render();
  },
  async signOut(){ if(S.sb) await S.sb.auth.signOut(); },
  theme(b){ S.theme = b.dataset.v; applyTheme(S.theme); try{ localStorage.setItem('daybook.theme', S.theme); }catch(e){} render(); },
  subToggleRow(b){ const t = S.tasks.find(x => x.id === b.dataset.id); if(!t) return; patchTask(t.id, {subtasks:t.subtasks.map((x, i) => i === +b.dataset.i ? {t:x.t, done:!x.done} : x)}); },
  askClear(){ S.askClear = !S.askClear; render(); },
  clearExamples(){
    S.tasks.filter(x => x.example).forEach(x => write('tasks/' + x.id, 'delete'));
    S.projects.filter(x => x.example).forEach(x => write('projects/' + x.id, 'delete'));
    S.checkins.filter(x => x.example).forEach(x => write('checkins/' + x.id, 'delete'));
    S.askClear = false; toast('Sample items deleted');
  },
  mStatus(b){ patchTask(S.modal, {status:b.dataset.v}); },
  mPrio(b){ patchTask(S.modal, {priority:+b.dataset.v}); },
  subAdd(){ const el = document.getElementById('m-sub'); const v = el && el.value.trim(); const t = S.tasks.find(x => x.id === S.modal); if(!v || !t) return; patchTask(t.id, {subtasks:(t.subtasks || []).concat([{t:v, done:false}])}); el.value = ''; },
  subToggle(b){ const t = S.tasks.find(x => x.id === S.modal); if(!t) return; const s = t.subtasks.map((x, i) => i === +b.dataset.i ? {t:x.t, done:!x.done} : x); patchTask(t.id, {subtasks:s}); },
  subDel(b){ const t = S.tasks.find(x => x.id === S.modal); if(!t) return; patchTask(t.id, {subtasks:t.subtasks.filter((x, i) => i !== +b.dataset.i)}); },
  logAdd(){ const el = document.getElementById('m-log'); const v = el && el.value.trim(); const t = S.tasks.find(x => x.id === S.modal); if(!v || !t) return; patchTask(t.id, {log:(t.log || []).concat([{d:today(), at:nowIso(), text:v}])}); el.value = ''; toast('Entry saved'); },
  askDelete(){ S.askDelete = !S.askDelete; renderModal(); },
  delTask(){ const id = S.modal; closeModal(); write('tasks/' + id, 'delete'); toast('Task deleted'); },
  histArea(b){ S.hist.area = b.dataset.v; render(); },
  histMore(){ S.hist.days += 30; render(); },
  pfArea(b){ S.pf.area = b.dataset.v; render(); },
  pfColor(b){ S.pf.color = b.dataset.v; render(); },
  addProject(){
    const name = S.pf.name.trim(); if(!name) return;
    if(!S.user){ toast('Not connected to the database, so nothing is saved.'); return; }
    write('projects/' + newId('projects'), 'set', {name:name, area:S.pf.area, color:S.pf.color, archived:false, createdAt:nowIso()});
    S.pf.name = ''; render();
  },
  toggleArchive(b){ const p = proj(b.dataset.id); if(p) write('projects/' + p.id, 'update', {archived:!p.archived}); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const f = ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.bind){ setPath(el.dataset.bind, el.value); if(el.dataset.render) render(); }
  if(el.dataset.mchg === 'pct'){ const o = document.getElementById('m-pct-out'); if(o) o.textContent = el.value + '%'; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.bind && el.tagName === 'SELECT'){ setPath(el.dataset.bind, el.value); if(el.dataset.render) render(); }
  if(el.dataset.chg && ACT[el.dataset.chg]) ACT[el.dataset.chg](el);
  if(el.dataset.mchg && S.modal){
    const k = el.dataset.mchg, v = el.value;
    if(k === 'title'){ if(v.trim()) patchTask(S.modal, {title:v.trim()}); }
    else if(k === 'target'){ if(v.indexOf('p:') === 0){ const p = proj(v.slice(2)); if(p) patchTask(S.modal, {projectId:p.id, area:p.area}); } else patchTask(S.modal, {projectId:'', area:v.slice(6)}); }
    else if(k === 'pct') patchTask(S.modal, {pct:+v});
    else patchTask(S.modal, {[k]:v});
  }
  if(el.dataset.pchg === 'name'){ const v = el.value.trim(); if(v) write('projects/' + el.dataset.id, 'update', {name:v}); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.modal){ closeModal(); return; }
  if(e.key === 'Enter' && !e.isComposing && e.target.dataset && e.target.dataset.enter && e.target.tagName === 'INPUT'){ e.preventDefault(); ACT[e.target.dataset.enter](e.target); }
});
window.addEventListener('hashchange', () => { if(location.hash === '#express'){ S.flow = false; go('dash'); } });

/* ---------- boot ---------- */
if(location.hash === '#express'){ S.view = 'dash'; }
render();
init();
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.user) reloadSoon(); });
})();

</script>
</body>
</html>
