<title>Progress Dashboard</title>

<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}

/* ---------- ambient clock: animated once on the root so the light never restarts when the screen redraws ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --pulse{syntax:'<number>';inherits:true;initial-value:.5}
@property --ry{syntax:'<percentage>';inherits:false;initial-value:-60%}
@keyframes k-spin{to{--ang:360deg}}
@keyframes k-pulse{from{--pulse:0}to{--pulse:1}}
@keyframes k-sheen{to{background-position:-200% 0}}
@keyframes k-run{from{--ry:-60%}to{--ry:160%}}
@keyframes k-drift{0%{transform:translate3d(-10vw,-12vh,0)}50%{transform:translate3d(38vw,52vh,0)}100%{transform:translate3d(72vw,2vh,0)}}
/* the travelling edge light is clocked once on the page area (it survives redraws); the glow pulse lives on the lit cards only */
html{--spd:9s}
html[data-motion=full]{--spd:4s}
.card.lit{animation:k-pulse calc(var(--spd)/2) ease-in-out infinite alternate}
html[data-motion=off]{--pulse:.55}
html[data-motion=off] .rail::after{--ry:20%}
html[data-motion=off] .card.lit::before{--ang:210deg}
html[data-motion=off] body::before{transform:translate3d(30vw,8vh,0)}

/* ---------- colour: dark grey and ivory, one gem accent chosen by the owner ---------- */
:root{
  --bg:#F6F2E7;--surface:#FFFEF9;--surface2:#EFEADB;--ink:#23262B;--ink2:#464A52;--ink3:#62666E;
  --line:#E2DCCB;--line2:#CFC8B4;--ctl:#8A8678;--rail:#2B2E33;--rail-ink:#F3EEDF;--rail-ink2:#C9C5B8;--rail-line:#43474E;
  --p0:#5A5E66;--p1:#8A4D00;--p2:#AE3206;--ok:#1B7550;--bad:#C0390A;--bad-fill:#BD3908;--on:#FFFFFF;
  --c1:#2F5DBF;--c2:#1F7A62;--c3:#B25A14;--c4:#7A4FB0;--c5:#B03C7A;--c6:#5F6877;
  --r:16px;--rs:10px;--f-d:'Marcellus','IBM Plex Sans Thai',Georgia,serif;--f-b:'Manrope','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gA:#A50E28;--gM:#C8102E;--gB:#F04A68;--acc:var(--gA);--ring:var(--gA);--wash:.12;--lift:0 1px 0 rgba(255,255,255,.6) inset,0 10px 26px -18px rgba(35,38,43,.35);
  color-scheme:light;
}
html[data-mode=dark]{
  --bg:#1D1F23;--surface:#272A30;--surface2:#2F333A;--ink:#F4EFE0;--ink2:#CFCBBE;--ink3:#A6A399;
  --line:#383C44;--line2:#4B505A;--ctl:#7C8088;--rail:#141619;--rail-ink:#F3EEDF;--rail-ink2:#B9B5A9;--rail-line:#2A2D33;
  --p0:#B9B5AA;--p1:#F0B04A;--p2:#FF8E60;--ok:#5CC9A0;--bad:#FF7A45;--bad-fill:#B93A08;
  --c1:#8FB0FF;--c2:#6FD1B0;--c3:#F0A25E;--c4:#C2A3F0;--c5:#F08CBA;--c6:#A9B2C0;
  --gA:#B30F2E;--gM:#D4153A;--gB:#FF5C7A;--acc:var(--gB);--ring:var(--gB);--wash:.2;--lift:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
html[data-accent=sapphire]{--gA:#0B3BC2;--gM:#1F57E8;--gB:#4C8DFF}
html[data-accent=sapphire][data-mode=dark]{--gA:#0C3FD6;--gM:#2260F5;--gB:#5B9BFF}
html[data-accent=emerald]{--gA:#056A47;--gM:#08805A;--gB:#1FD39A}
html[data-accent=emerald][data-mode=dark]{--gA:#06704A;--gM:#09805A;--gB:#3DE0AC}
html[data-accent=amethyst]{--gA:#5B21B6;--gM:#7C3AED;--gB:#B28BFF}
html[data-accent=amethyst][data-mode=dark]{--gA:#6D28D9;--gM:#7C3AED;--gB:#C4A4FF}
html[data-accent=topaz]{--gA:#92400E;--gM:#B45309;--gB:#FBA415}
html[data-accent=topaz][data-mode=dark]{--gA:#A64B07;--gM:#B84E08;--gB:#FFC94A}
html[data-accent=ruby],html[data-accent=sapphire],html[data-accent=emerald],html[data-accent=amethyst],html[data-accent=topaz]{--lit:color-mix(in srgb,var(--gB) 82%,#fff)}

/* ---------- base ---------- */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-b);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;min-height:100dvh;transition:background-color .3s,color .3s}
body::before{content:"";position:fixed;left:0;top:0;width:min(900px,90vw);height:min(640px,70vh);z-index:-1;pointer-events:none;will-change:transform;background:radial-gradient(closest-side,color-mix(in srgb,var(--gA) calc(var(--wash)*100%),transparent),transparent);animation:k-drift calc(var(--spd)*3) ease-in-out infinite alternate}
::selection{background:color-mix(in srgb,var(--gM) 38%,transparent);color:var(--ink)}
input,textarea,select{caret-color:var(--gB)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
h1,h2{font-family:var(--f-d);font-weight:400;margin:0;line-height:1.12;letter-spacing:0;text-wrap:balance}
h3,h4{margin:0;font-weight:700;line-height:1.3}
h1{font-size:clamp(32px,4.6vw,44px)}
h2{font-size:22px}
p{margin:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;background:var(--rail);color:var(--rail-ink);padding:28px 16px 18px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--rail-line)}
.rail::after{content:"";position:absolute;top:0;right:-1px;width:3px;height:100%;pointer-events:none;background:linear-gradient(180deg,transparent 0,var(--gB) 50%,transparent 100%) 0 var(--ry)/100% 42% no-repeat,linear-gradient(180deg,transparent,color-mix(in srgb,var(--gB) 40%,transparent),transparent);animation:k-run calc(var(--spd)*.9) linear infinite}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 22px;font:400 19px/1.1 var(--f-d)}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--rs);color:var(--rail-ink2);font-weight:600;position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.34,1.56,.64,1),background-color .2s,color .2s}
.nav svg{flex:none;opacity:.9}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:700;opacity:.8}
.nav:hover{color:var(--rail-ink);background:rgba(255,255,255,.06);transform:translateX(4px)}
.nav[aria-current=page]{color:#fff;background:linear-gradient(90deg,var(--gA),var(--gM));box-shadow:0 8px 20px -12px var(--gM)}
.rail .sp{flex:1}
.who{padding:10px 12px 0;font-size:12.5px;color:var(--rail-ink2);word-break:break-all;border-top:1px solid var(--rail-line);margin-top:8px}
.look-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--rs);color:var(--rail-ink2);font-weight:600;transition:background-color .2s,color .2s}
.look-btn:hover{background:rgba(255,255,255,.06);color:var(--rail-ink)}
.look-btn i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--gA),var(--gB));box-shadow:0 0 0 2px var(--rail),0 0 0 3px color-mix(in srgb,var(--gB) 60%,transparent);flex:none;margin:0 1px}
main{padding:34px clamp(16px,3.4vw,48px) 90px;min-width:0}
#view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabbar{display:none}

/* ---------- cards: ambient light travels slowly around the edge ---------- */
.card{position:relative;isolation:isolate;background:var(--surface);border:1px solid color-mix(in srgb,var(--gB) 30%,var(--line));border-radius:var(--r);padding:22px 24px;box-shadow:var(--lift),0 0 calc(8px + 22px*var(--pulse)) -8px color-mix(in srgb,var(--gA) 60%,transparent)}
.card{container-type:inline-size}
@container (max-width:780px){
  .trow{grid-template-columns:40px minmax(0,1fr) auto}
  .trow .cells{grid-column:2/-1;flex-wrap:wrap;gap:8px}
  .trow .dn{grid-column:3;grid-row:1}
  .trow .subs{grid-column:2/-1}
}
.card.lit::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;z-index:2;background:conic-gradient(from var(--ang),transparent 0 44%,var(--gA) 62%,var(--lit) 82%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:k-spin var(--spd) linear infinite;animation-delay:calc(var(--clock,0s)*-1)}
.ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ch .sub{color:var(--ink3);font-size:13.5px}.ch .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;background:linear-gradient(90deg,var(--gB),transparent 55%) left bottom/100% 2px no-repeat}
.page-h .date{color:var(--ink2);margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.empty{color:var(--ink3);padding:14px 0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--surface);color:var(--ink2)}

/* ---------- controls ---------- */
.btn,.dn,.star,.nav,.seg button,.chipb,.look-btn,.dd-b{position:relative;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-weight:700;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background-color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);border-color:color-mix(in srgb,var(--gB) 55%,var(--line2))}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,var(--gA),var(--gM));border-color:transparent;color:#fff;box-shadow:0 10px 22px -12px var(--gM)}
.btn-primary:hover{border-color:transparent;box-shadow:0 14px 26px -12px var(--gM)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:7px 12px;font-size:13.5px}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-danger{background:var(--bad-fill);border-color:transparent;color:#fff}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);transition:background-color .2s,transform .2s}
.icon-btn:hover{background:var(--surface2);transform:scale(1.1)}
.rip{position:absolute;border-radius:50%;background:var(--lit);opacity:0;pointer-events:none;animation:k-rip .65s ease-out}
@keyframes k-rip{from{transform:scale(0);opacity:.5}to{transform:scale(1);opacity:0}}
html[data-motion=off] .rip{display:none}
input[type=text],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;padding:11px 14px;border-radius:var(--rs);border:1px solid var(--ctl);background:var(--surface);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 28%,transparent)}
textarea{min-height:84px;resize:vertical}
label,.lab{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
::placeholder{color:var(--ink3)}
input[type=range]{accent-color:var(--gM)}
input[type=date]{color-scheme:inherit}

/* segmented control with a gliding thumb */
.seg{--n:3;--i:0;position:relative;display:inline-grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:3px;border-radius:calc(var(--rs) + 3px);background:var(--surface2);border:1px solid var(--line)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:var(--rs);background:linear-gradient(135deg,var(--gA),var(--gM));box-shadow:0 6px 16px -8px var(--gM);transform:translateX(calc(var(--i)*100%));transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
.seg[data-none] .thumb{opacity:0}
.seg button{position:relative;z-index:1;padding:9px 12px;text-align:center;white-space:nowrap;font-weight:700;border-radius:var(--rs);color:var(--ink2);transition:color .2s}
.seg button[aria-pressed=true]{color:#fff}
.seg button:hover:not([aria-pressed=true]){color:var(--ink)}
.seg-fill{display:grid;width:100%}
.seg-fill button{padding-inline:4px;font-size:14px}
@container (max-width:400px){.seg-fill button{font-size:13px}}
.seg5 button{padding:12px 0;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{padding:8px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-weight:700;color:var(--ink2);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .2s,color .2s,border-color .2s}
.chipb:hover{transform:translateY(-2px);border-color:var(--gB)}
.chipb[aria-pressed=true]{background:linear-gradient(135deg,var(--gA),var(--gM));border-color:transparent;color:#fff}
.dd{position:relative;display:inline-block;min-width:230px}
.dd-b{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--surface);font-weight:700}
.dd-b::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg) translateY(-2px);transition:transform .25s}
.dd-b[aria-expanded=true]::after{transform:rotate(225deg)}
.dd-m{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line2);border-radius:var(--rs);box-shadow:0 22px 44px -18px rgba(0,0,0,.55);animation:k-menu .22s cubic-bezier(.2,.8,.2,1)}
@keyframes k-menu{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dd-m button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-weight:600}
.dd-m button:hover,.dd-m button[aria-pressed=true]{background:var(--surface2)}
.sw{width:16px;height:16px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--s1),var(--s2));box-shadow:0 0 0 2px var(--surface),0 0 0 3px color-mix(in srgb,var(--s2) 65%,transparent)}
.pop{position:fixed;z-index:60;left:16px;bottom:16px;width:272px;padding:16px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 26px 60px -20px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:14px;animation:k-menu .24s cubic-bezier(.2,.8,.2,1)}
.pop .acc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pop .acc button{display:grid;place-items:center;padding:8px 0;border-radius:var(--rs);border:1px solid var(--line);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.pop .acc button:hover{transform:translateY(-3px) scale(1.06)}
.pop .acc button[aria-pressed=true]{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in srgb,var(--ring) 35%,transparent)}

/* ---------- tasks ---------- */
.list{display:flex;flex-direction:column}
.grp{display:flex;align-items:center;gap:12px;padding:20px 4px 10px;flex-wrap:wrap}
.grp:first-child{padding-top:4px}
.grp h3{font:400 21px var(--f-d)}
.grp .pc{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;font-weight:700}
.thread{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:90px;flex:1;max-width:200px}
.thread i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gA),var(--gB),var(--gA)) 0 0/200% 100%;box-shadow:0 0 12px -2px color-mix(in srgb,var(--gB) 70%,transparent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.card.lit .thread i{animation:k-sheen calc(var(--spd)/1.3) linear infinite}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:12px 8px 12px 12px;border-top:1px solid var(--line);position:relative;border-radius:var(--rs);transition:background-color .2s,box-shadow .25s,opacity .3s}
.trow:hover{background:color-mix(in srgb,var(--gM) 7%,transparent)}
.trow{--pc:var(--p0)}.trow.p1{--pc:var(--p1)}.trow.p2{--pc:var(--p2)}
.trow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px}
.star{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ctl);color:var(--ink3);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background-color .2s,color .2s,border-color .2s}
.star svg{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.star:hover{transform:scale(1.18);border-color:var(--gB);color:var(--acc)}
.star:active{transform:scale(.88)}
.star.on{background:linear-gradient(135deg,var(--gA),var(--gM));border-color:var(--lit);color:#fff;box-shadow:0 0 calc(6px + 12px*var(--pulse)) -2px var(--gM)}
.star.on svg{transform:rotate(72deg) scale(1.06)}
.star.pop-a{animation:k-pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes k-pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.ttl{display:flex;flex-direction:column;gap:3px;min-width:0;padding:2px 0}
.ttl .tt{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.ttl .tt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%,transparent)}
.ttl .ts{color:var(--ink3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;padding-left:18px}
.cells{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:800;background:var(--surface2);color:var(--ink2);white-space:nowrap}

function write(path, op, data){

  const kind = path.split('/')[0], id = path.slice(kind.length + 1), key = KEY_OF[kind], arr = S[kind];
  const i = arr.findIndex(x => x.id === id);
  if(op === 'delete'){ if(i >= 0) arr.splice(i, 1); }
  else if(op === 'set'){ const doc = Object.assign({}, data, {id:id}); if(i >= 0) arr[i] = doc; else arr.push(doc); }
  else if(i >= 0) arr[i] = Object.assign({}, arr[i], data);
  scheduleRender();
  const run = async () => {
    const q = S.sb.from(kind);
    let res;
    if(op === 'delete') res = await q.delete().eq(key, id);
    else if(op === 'set'){
      const row = toRow(kind, data); row[key] = id; row.user_id = S.user.id; row.updated_by = 'app';
      res = await q.upsert(row, {onConflict:kind === 'checkins' ? 'user_id,date' : 'id'});
    } else {
      const row = toRow(kind, data); row.updated_by = 'app';
      res = await q.update(row).eq(key, id);
    }
    if(res.error) throw res.error;
  };
  pending++;
  const p = (chain[path] || Promise.resolve()).then(run).catch(e => { toast('Could not save: ' + ((e && e.message) || 'error')); reloadSoon(true); }).finally(() => { pending--; });
  chain[path] = p;

}

/* Company and Personal */
function areaTasks(a){
  const f = S.f[a], q = f.q.trim().toLowerCase(), t = today();
  let list = S.tasks.filter(x => x.area === a && (!q || (x.title + ' ' + pathOf(x) + ' ' + (x.subtasks || []).map(s => s.t).join(' ')).toLowerCase().indexOf(q) >= 0));
  if(f.cat === '__none') list = list.filter(x => !proj(x.projectId)); else if(f.cat !== 'all') list = list.filter(x => x.projectId === f.cat);
  if(f.show === 'open') list = list.filter(isOpen); else if(f.show === 'recent') list = list.filter(x => isOpen(x) || x.doneDate > addDays(t, -7)); else list = list.filter(x => !isOpen(x));
  return list.sort(SORTS[f.sort]);
}
function vArea(a){

function chartSvg(days){
  const W = 640, H = 220, L = 30, R = 10, T = 12, B = 28, n = days.length;
  const x = i => L + (W - L - R) * (i / (n - 1)), y = v => T + (H - T - B) * (1 - (v - 1) / 4);
  let g = '';
  for(let v = 1; v <= 5; v++) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  days.forEach((d, i) => { if(i % 2 === 0 || i === n - 1){ const p = parse(d.date); g += '<text class="ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + p.getDate() + '/' + (p.getMonth() + 1) + '</text>'; } });
  const series = (k, cls) => {
    let path = '', prev = false, pts = '';
    days.forEach((d, i) => { if(d[k]){ path += (prev ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[k]).toFixed(1); prev = true; pts += '<circle class="p' + cls + '" cx="' + x(i).toFixed(1) + '" cy="' + y(d[k]).toFixed(1) + '" r="3.4"/>'; } else prev = false; });
    return '<path class="s' + cls + '" d="' + path + '"/>' + pts;
  };
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Body and mind scores for the last 14 days">' + g + series('body', 1) + series('mind', 2) + '</svg>';
}

  toggleFocus(b){ const t = findT(b); if(!t) return; b.classList.toggle('on'); animThen(b, 'pop-a', 320, () => patchTask(t.id, {focusDate:t.focusDate === today() ? '' : today()})); },
  openTask(b){ openModal(b.dataset.id); },
  closeModal(){ closeModal(); },
  todoDay(b){ S.td.day = b.dataset.v; },
  todoAdd(){
    const text = S.td.text.trim();
    if(!text){ const el = document.getElementById('td-text'); if(el) el.focus(); return; }
    if(!S.user){ toast('Sign in to save changes.'); return; }
    write('todos/' + newId(), 'set', {text:text.slice(0, 300), day:todoDay(S.td.day), done:false, doneAt:'', createdAt:nowIso()});
    S.td.text = ''; render();
    const el = document.getElementById('td-text'); if(el) el.focus();
  },
  todoDone(b){ const x = S.todos.find(t => t.id === b.dataset.id), row = b.closest('.todo'); if(!x || (row && row.classList.contains('is-done'))) return;
    b.classList.add('ok'); if(row) row.classList.add('is-done');
    const go = () => write('todos/' + x.id, 'update', {done:true, doneAt:nowIso()});
    if(motionOn()) setTimeout(go, 520); else go(); },
  todoUndo(b){ write('todos/' + b.dataset.id, 'update', {done:false, doneAt:''}); },
  todoLater(b){ write('todos/' + b.dataset.id, 'update', {day:addDays(today(), 1)}); toast('Moved to tomorrow'); },
  todoDel(b){ write('todos/' + b.dataset.id, 'delete'); },
  areaCat(b){ S.f[b.dataset.a].cat = b.dataset.v; render(); fsheetPaint(); },
  areaF(b){ const [a, k] = b.dataset.k.split('.'); S.f[a][k] = b.dataset.v; render(); fsheetPaint(); },
  openFilter(b){ openFilter(b.dataset.a); },
  closeFilter(){ closeFilter(); },
  filterReset(b){ const a = b.dataset.a; Object.assign(S.f[a], FILTER_DEFAULT); render(); fsheetPaint(); },
  ntArea(b){ S.nt.area = b.dataset.v; S.nt.cat = ''; S.nt.newCat = ''; render(); },
  ntPrio(b){ S.nt.prio = +b.dataset.v; },
  ntDue(b){ S.nt.due = b.dataset.v; const el = document.getElementById('nt-due'); if(el) el.value = S.nt.due; ntPaint(); },
  ntPick(b){ S.nt.pick = !S.nt.pick; b.setAttribute('aria-pressed', String(S.nt.pick)); },
  ntSubAdd(){ const el = document.getElementById('nt-sub'), v = el && el.value.trim(); if(!v) return; S.nt.subs.push(v.slice(0, 300)); render(); const n = document.getElementById('nt-sub'); if(n) n.focus(); },
  ntSubDel(b){ S.nt.subs.splice(+b.dataset.i, 1); render(); },
  ntReset(){ const a = S.nt.area; S.nt = {area:a, cat:'', newCat:'', title:'', due:'', prio:0, notes:'', subs:[], pick:false}; render(); },
  createNew(){
    const n = S.nt;
    if(!n.due){ toast('Every task needs a deadline.'); const e = document.getElementById('nt-due'); if(e) e.focus(); return; }
    if(!ntValid()) return;
    if(!S.user){ toast('Sign in to save changes.'); return; }
    let pid = n.cat, area = n.area;
    if(n.cat === '__new'){ pid = newId(); write('projects/' + pid, 'set', {name:n.newCat.trim().slice(0, 80), area:area, color:'c' + (1 + S.projects.length % 6), archived:false, createdAt:nowIso()}); }
    else { const p = proj(pid); if(p) area = p.area; }
    createTask({title:n.title.trim().slice(0, 300), area:area, projectId:pid, due:n.due, priority:n.prio, notes:n.notes.slice(0, 5000), subtasks:n.subs.map(s => ({t:s, done:false})), focusDate:n.pick ? today() : ''});
    toast('Task created');
    S.nt = {area:area, cat:pid, newCat:'', title:'', due:'', prio:0, notes:'', subs:[], pick:false}; render();
    const el = document.getElementById('nt-title'); if(el) el.focus();
  },
  async signIn(){
    if(S.loginBusy || !S.sb) return;
    const email = S.login.email.trim(), password = S.login.pass;
    if(!email || !password){ S.loginErr = 'Enter your email and password.'; return render(); }
    S.loginBusy = true; S.loginErr = ''; render();
    const res = await S.sb.auth.signInWithPassword({email:email, password:password});
    S.loginBusy = false; S.login.pass = '';
    if(res.error) S.loginErr = /invalid/i.test(res.error.message) ? 'Email or password is incorrect.' : res.error.message;
    render();
  },
  async signOut(){ if(S.sb) await S.sb.auth.signOut(); },
  subToggleRow(b){ const t = findT(b); if(!t) return; patchTask(t.id, {subtasks:t.subtasks.map((x, i) => i === +b.dataset.i ? {t:x.t, done:!x.done} : x)}); },
  askClear(){ S.askClear = !S.askClear; render(); },
  clearExamples(){
    S.tasks.filter(x => x.example).forEach(x => write('tasks/' + x.id, 'delete'));
    S.projects.filter(x => x.example).forEach(x => write('projects/' + x.id, 'delete'));
    S.checkins.filter(x => x.example).forEach(x => write('checkins/' + x.id, 'delete'));
    S.askClear = false; toast('Sample items deleted');
  },
  mStatus(b){ patchTask(S.modal, {status:b.dataset.v}); },
  mPrio(b){ patchTask(S.modal, {priority:+b.dataset.v}); },
  subAdd(){ const el = document.getElementById('m-sub'); const v = el && el.value.trim(); const t = S.tasks.find(x => x.id === S.modal); if(!v || !t) return; patchTask(t.id, {subtasks:(t.subtasks || []).concat([{t:v.slice(0, 300), done:false}])}); el.value = ''; },
  subToggle(b){ const t = S.tasks.find(x => x.id === S.modal); if(!t) return; patchTask(t.id, {subtasks:t.subtasks.map((x, i) => i === +b.dataset.i ? {t:x.t, done:!x.done} : x)}); },
  subDel(b){ const t = S.tasks.find(x => x.id === S.modal); if(!t) return; patchTask(t.id, {subtasks:t.subtasks.filter((x, i) => i !== +b.dataset.i)}); },
  logAdd(){ const el = document.getElementById('m-log'); const v = el && el.value.trim(); const t = S.tasks.find(x => x.id === S.modal); if(!v || !t) return; patchTask(t.id, {log:(t.log || []).concat([{d:today(), at:nowIso(), text:v.slice(0, 2000)}])}); el.value = ''; toast('Entry saved'); },
  askDelete(){ S.askDelete = !S.askDelete; renderModal(); },
  delTask(){ const id = S.modal; closeModal(); write('tasks/' + id, 'delete'); toast('Task deleted'); },
  histArea(b){ S.hist.area = b.dataset.v; render(); },
  histMore(){ S.hist.days += 30; render(); },
  pfArea(b){ S.pf.area = b.dataset.v; render(); },
  addProject(){
    const name = S.pf.name.trim(); if(!name) return;
    if(!S.user){ toast('Sign in to save changes.'); return; }
    write('projects/' + newId(), 'set', {name:name.slice(0, 80), area:S.pf.area, color:S.pf.color, archived:false, createdAt:nowIso()});
    S.pf.name = ''; render();
  },
  toggleArchive(b){ const p = proj(b.dataset.id); if(p) write('projects/' + p.id, 'update', {archived:!p.archived}); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(S.popOpen && !e.target.closest('.pop') && !e.target.closest('[data-act="togglePop"]')) closePop();
  if(!e.target.closest('.dd')) closeDD();
  if(!b) return;
  const f = ACT[b.dataset.act]; if(!f) return;
  e.preventDefault();
  const sg = b.closest('.seg');
  if(sg && sg.querySelector('.thumb') && b.getAttribute('aria-pressed') !== 'true'){
    slideTo(b);
    if(b.dataset.fast || !motionOn()) f(b, e); else setTimeout(() => f(b, e), 260);
  } else f(b, e);
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.btn,.dn,.star,.nav,.seg button,.chipb,.look-btn,.dd-b');
  if(!el || !motionOn()) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = document.createElement('span');
  s.className = 'rip'; s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
  el.appendChild(s); setTimeout(() => s.remove(), 700);
}, {passive:true});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.bind){ setPath(el.dataset.bind, el.value); if(el.dataset.render) render(); if(el.dataset.bind.indexOf('nt.') === 0) ntPaint(); if(S.fsheet) fsheetCount(); }
  if(el.dataset.mchg === 'pct'){ const o = document.getElementById('m-pct-out'); if(o) o.textContent = el.value + '%'; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.bind && el.tagName === 'SELECT'){ setPath(el.dataset.bind, el.value); if(el.dataset.render) render(); }
  if(el.dataset.mchg && S.modal){
    const k = el.dataset.mchg, v = el.value;
    if(k === 'title'){ if(v.trim()) patchTask(S.modal, {title:v.trim().slice(0, 300)}); }
    else if(k === 'target'){ if(v.indexOf('p:') === 0){ const p = proj(v.slice(2)); if(p) patchTask(S.modal, {projectId:p.id, area:p.area}); } else patchTask(S.modal, {projectId:'', area:v.slice(6)}); }
    else if(k === 'pct') patchTask(S.modal, {pct:+v});
    else if(k === 'due'){ if(!v){ toast('Every task needs a deadline.'); renderModal(); } else patchTask(S.modal, {due:v}); }
    else patchTask(S.modal, {[k]:v.slice(0, 5000)});
  }
  if(el.dataset.pchg === 'name'){ const v = el.value.trim(); if(v) write('projects/' + el.dataset.id, 'update', {name:v.slice(0, 80)}); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(S.modal) closeModal();
    else if(S.fsheet) closeFilter();
    else if(S.popOpen) closePop(true);
    else { const open = document.querySelector('.dd-m:not([hidden])'); if(open){ const t = open.parentNode.querySelector('.dd-b'); closeDD(); if(t) t.focus(); } }
    return;
  }
  if(e.key === 'Enter' && !e.isComposing && e.target.dataset && e.target.dataset.enter && e.target.tagName === 'INPUT'){ e.preventDefault(); ACT[e.target.dataset.enter](e.target); }
});
function fromHash(){ const v = location.hash.slice(1); if(!S.user) return; if(v === 'express') return go('dash', true); if(ROUTES.indexOf(v) >= 0 && v !== S.view) go(v, true); }
window.addEventListener('hashchange', fromHash);
window.addEventListener('popstate', fromHash);

/* ---------- boot ---------- */
(function(){ const v = location.hash.slice(1); if(ROUTES.indexOf(v) >= 0) S.view = v; })();
render();
init();
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.user) reloadSoon(); });
})();

/* Installable app: lets phones offer "Install / Add to Home Screen". Needs https (GitHub Pages) or localhost. */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
